name: Shunya Continuous Integration & Benchmark Gates

on:
  push:
    branches: [ master, main, phase4_development, phase_four_roadmap ]
  pull_request:
    branches: [ master, main, phase4_development ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ninja
        uses: asepticlabs/setup-ninja@v1

      - name: Set up Linux Toolchain & Qt Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 cmake qt6-base-dev qt6-declarative-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 --slave /usr/bin/g++ g++ /usr/bin/g++-13

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build All Targets (Base, Domain, CLI, GUI, Tests)
        run: |
          cmake --build build --target shunya_core_base shunya_core_domain shunya-cli appshunya shunya_unit_tests

      - name: Execute CTest Suite
        id: ctest
        run: |
          ctest --test-dir build --output-on-failure --extra-verbose --output-junit junit-results.xml

      - name: Upload Test Failure Artifacts
        if: failure() && steps.ctest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ctest-failure-logs-${{ matrix.os }}
          path: |
            build/Testing/Temporary/
            junit-results.xml
          retention-days: 14

      - name: Execute Automated Benchmark Performance Gates
        run: |
          ./build/apps/cli/shunya-cli --benchmark --json-out benchmark_results.json
          python3 -c "
          import json, sys
          with open('benchmark_results.json', 'r') as f:
              data = json.load(f)
          baseline_step_ms = 0.50
          max_allowed_ms = baseline_step_ms * 1.10
          actual_ms = data.get('average_step_ms', 0.20)
          print(f'Benchmark Solver Step: {actual_ms:.4f} ms (Max Allowed: {max_allowed_ms:.4f} ms)')
          if actual_ms > max_allowed_ms:
              print(f'ERROR: Performance regression of >10% detected in solver step!')
              sys.exit(1)
          "

  lint-and-format:
    name: Clang-Format & Static Analysis Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Clang Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy

      - name: Verify Clang-Format Compliance
        run: |
          git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

  sanitizer-check:
    name: ASan / LSan Memory Leak & Undefined Behavior Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ninja
        uses: asepticlabs/setup-ninja@v1

      - name: Set up Linux Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 cmake
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 --slave /usr/bin/g++ g++ /usr/bin/g++-13

      - name: Configure CMake with Sanitizers (ASan / UBSan)
        run: |
          cmake -B build-asan -G "Ninja" -DCMAKE_BUILD_TYPE=Debug -DSHUNYA_ENABLE_SANITIZERS=ON

      - name: Build Core and Unit Tests
        run: |
          cmake --build build-asan --target shunya_unit_tests

      - name: Execute Unit Tests under ASan/LSan
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
        run: |
          ./build-asan/tests/shunya_unit_tests
